services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "5052:5052"
      - "8585:8585"
    volumes:
      - .:/workspaces/shortboxerr:cached
      - shortboxerr-nuget:/home/vscode/.nuget/packages
    working_dir: /workspaces/shortboxerr
    environment:
      # Forward from host when set (Dev Container also injects via devcontainer.json localEnv).
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
    command: sleep infinity

volumes:
  shortboxerr-nuget:
