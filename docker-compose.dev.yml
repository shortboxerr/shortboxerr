services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "5052:5052"
      - "8585:8585"
    volumes:
      - .:/workspaces/shortboxerr:cached
      - shortboxerr-nuget:/home/vscode/.nuget/packages
    working_dir: /workspaces/shortboxerr
    command: sleep infinity

volumes:
  shortboxerr-nuget:
