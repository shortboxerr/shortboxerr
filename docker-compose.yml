services:
  shortboxerr:
    build: .
    container_name: shortboxerr
    ports:
      - "7878:7878"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:7878
      - SHORTBOXERR_DB=Data Source=/data/shortboxerr.db
      - SHORTBOXERR_LIBRARY_ROOT=/data/library
      - SHORTBOXERR_STAGING=/data/staging
      - SHORTBOXERR_FAILED=/data/failed
    volumes:
      - ./data:/data
    restart: unless-stopped
