name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: ui
            name: UI
          - dir: tests/e2e
            name: E2E
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: npm audit (${{ matrix.name }})
        run: |
          npm ci
          npm audit --audit-level=high

      - name: ESLint (UI, zero warnings)
        if: matrix.name == 'UI'
        run: npm run lint

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for repositories owned by a GitHub Organization (gitleaks/gitleaks-action v2).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # OSV.dev cross-check for npm lockfiles (complements npm audit + NuGet Audit). Pin version with OSV_VERSION.
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.3.5
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan npm lockfiles (OSV)
        run: osv-scanner scan source -L ui/package-lock.json -L tests/e2e/package-lock.json

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, npm-audit, secret-scan, osv-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build Docker image
      run: docker build -t shortboxerr:${{ github.sha }} .

    - name: Test Docker image health endpoint
      run: |
        docker run -d --name test-container -p 8585:8585 shortboxerr:${{ github.sha }}
        sleep 5
        curl -f http://localhost:8585/health || exit 1
        docker stop test-container
