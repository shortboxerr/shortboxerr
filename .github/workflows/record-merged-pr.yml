# Append a row to docs/AUTO_MERGE_LOG.md when a PR merges to main.
#
# 1) Push branch merge-log/pr-* (GITHUB_TOKEN; direct push to main is ruleset-blocked).
# 2) Open and merge a PR into main. Many orgs disable "Allow GitHub Actions to create
#    pull requests"; then repository secret AUTO_MERGE_LOG_PAT (fine-grained PAT, this
#    repo, contents + pull requests) must be set for the PR create/merge API step.
#
# PRs whose head starts with merge-log/ are skipped (no recursion).
name: Record merged PR

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: record-merge-log
  cancel-in-progress: false

jobs:
  append-log:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'merge-log/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Append merge row (idempotent)
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const sha = pr.merge_commit_sha;
            if (!sha) {
              core.setFailed('No merge_commit_sha on payload');
              return;
            }
            const logPath = 'docs/AUTO_MERGE_LOG.md';
            let body = fs.readFileSync(logPath, 'utf8');
            if (body.includes(sha)) {
              core.info('Merge already recorded; skipping.');
              return;
            }
            const ts = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const title = (pr.title || '')
              .replace(/\|/g, '/')
              .replace(/\r?\n/g, ' ')
              .slice(0, 120);
            const line = `| ${ts} | #${pr.number} | ${title} | \`${sha}\` |\n`;
            if (!body.endsWith('\n')) body += '\n';
            fs.writeFileSync(logPath, body + line);

      - name: Create branch, commit, push
        id: push
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTO_MERGE_LOG.md
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA7="${MERGE_SHA:0:7}"
          BRANCH="merge-log/pr-${PR_NUM}-${SHA7}"
          git checkout -b "$BRANCH"
          git commit -m "chore: record merged PR #${PR_NUM} in AUTO_MERGE_LOG"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open and merge logging PR
        if: steps.push.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.AUTO_MERGE_LOG_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = process.env.HEAD_BRANCH;
            const sourcePr = process.env.SOURCE_PR;
            const htmlBase = process.env.HTML_BASE || 'https://github.com';
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: `chore: record merged PR #${sourcePr} in AUTO_MERGE_LOG`,
              head,
              base: 'main',
              body:
                `Automated update to [docs/AUTO_MERGE_LOG.md](${htmlBase}/${owner}/${repo}/blob/main/docs/AUTO_MERGE_LOG.md) for the merge of #${sourcePr}.`,
            });
            const pull_number = pr.number;
            core.info(`Opened PR #${pull_number}`);
            const methods = ['squash', 'merge'];
            for (let i = 0; i < 36; i++) {
              if (i > 0) await new Promise((r) => setTimeout(r, 10000));
              for (const merge_method of methods) {
                try {
                  await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number,
                    merge_method,
                  });
                  core.info(`Merged PR #${pull_number} (${merge_method})`);
                  return;
                } catch (e) {
                  const retry =
                    e.status === 405 || e.status === 422 || e.status === 409;
                  if (retry) {
                    core.info(
                      `Merge not ready (${merge_method}, attempt ${i + 1}): ${e.message}`,
                    );
                    continue;
                  }
                  throw e;
                }
              }
            }
            core.setFailed(
              'Could not merge logging PR after retries; merge it manually or adjust branch protection.',
            );
        env:
          HEAD_BRANCH: ${{ steps.push.outputs.branch }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
          HTML_BASE: ${{ github.server_url }}
